services:
  - type: web
    name: civicai
    env: node
    plan: free
    buildCommand: cd ../client && npm install && npm run build && cp -r dist ../server/public && cd ../server && npm install
    startCommand: node server.js
    rootDir: server
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
